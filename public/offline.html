<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1008" />
    <meta name="robots" content="noindex" />
    <title>Forma — Você está offline</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b1008;
        --ink-2: #131a0e;
        --cream: #f4efe3;
        --lime: #d8f65a;
        --lime-ink: #111609;
        --muted: rgba(244, 239, 227, 0.56);
        --border: rgba(244, 239, 227, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 0%, rgba(216, 246, 90, 0.09), transparent 42%),
          var(--ink);
        color: var(--cream);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 420px);
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        border-radius: 20px;
        background: var(--ink-2);
        border: 1px solid var(--border);
        box-shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.9);
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 9vw, 44px);
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }

      p {
        margin: 14px auto 0;
        max-width: 34ch;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        appearance: none;
        width: 100%;
        min-height: 52px;
        margin-top: 28px;
        border: 0;
        border-radius: 999px;
        background: var(--lime);
        color: var(--lime-ink);
        font: inherit;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
        transition:
          transform 160ms ease,
          background-color 160ms ease;
      }

      button:hover {
        background: #e7ff85;
      }

      button:active {
        transform: scale(0.98);
      }

      button:focus-visible {
        outline: 3px solid rgba(216, 246, 90, 0.35);
        outline-offset: 3px;
      }

      .footnote {
        margin-top: 20px;
        font-size: 12px;
        color: rgba(244, 239, 227, 0.34);
      }

      .status {
        min-height: 1.4em;
        margin-top: 14px;
        font-size: 12px;
        color: var(--lime);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <g fill="#d8f65a">
            <rect x="10" y="26" width="6" height="12" rx="2" />
            <rect x="17" y="20" width="6" height="24" rx="2" />
            <rect x="41" y="20" width="6" height="24" rx="2" />
            <rect x="48" y="26" width="6" height="12" rx="2" />
            <rect x="24" y="29" width="16" height="6" rx="2" />
          </g>
        </svg>
      </span>

      <h1>Você está offline</h1>
      <p>
        O Forma precisa de conexão para carregar seus treinos e dados. Verifique
        sua internet e tente novamente.
      </p>

      <button type="button" onclick="window.location.reload()">
        Tentar novamente
      </button>
      <p class="status" role="status" aria-live="polite"></p>
      <p class="footnote">Seus dados continuam salvos no servidor.</p>
    </main>

    <script>
      window.addEventListener("online", function () {
        document.querySelector(".status").textContent =
          "Conexão restaurada. Recarregando…";
        window.setTimeout(function () {
          window.location.reload();
        }, 700);
      });
    </script>
  </body>
</html>
