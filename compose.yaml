services:
  postgres:
    image: postgres:17-alpine
    container_name: forma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma_dev_password
    ports:
      - "5433:5432"
    volumes:
      - forma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  forma_postgres_data:
